# harness-sdd configuration
# The agents read this once (after init.sh) to learn HOW to read/write state.
# Swapping a backend value changes where memory lives WITHOUT changing any prompt.

store:
  on_write_command: ""   # post-write sync hook; empty ⇒ none (see store/board-mirror.md)
  # TaskStore: high-level epic/feature/task state the Orchestrator reads.
  #   local    -> state/tasks.json            (default, zero deps)
  #   obsidian -> specs/ markdown frontmatter (graph view, backlinks)
  #   jira     -> Atlassian via MCP           (STUBBED — see store/jira.md)
  tasks: local

  # DocStore: the externalized memory — specs, progress, history.
  #   local    -> markdown files in specs/ and progress/
  #   obsidian -> same files, Obsidian-flavored (wikilinks + frontmatter)
  docs: local

workflow:
  # Human-in-the-loop gate. When true, a feature pauses at `spec-ready` until a
  # human moves it to `in-progress`. Individual tasks can opt out via `sdd: false`
  # or `autonomous: true` in their frontmatter / TaskStore entry.
  require_spec_approval: true

  # Context hygiene: agents should reset context when their window passes this
  # fraction full, handing off via progress/ files. Degradation starts ~0.20.
  context_reset_threshold: 0.40

execution:
  # This repo IS the multi-CLI executor, so it opts the Builder phase into
  # delegation. Only the Builder is delegatable; Orchestrator/Architect/Reviewer/
  # Scout always run in the host code-agent. See the upstream harness config for
  # the full contract.
  builder:
    backend: delegate
    # Bridge: assembles the feature's 4-file spec → invoke-worker.sh chokepoint.
    # Invoked as `<delegate_cmd> <feature-id> <abs-spec-path>` from the repo root.
    delegate_cmd: "bash skills/start-feature/scripts/harness-delegate.sh"

verification:
  integration_command: ""   # umbrella integration gate (see docs/UMBRELLA.md)
  init_script: ./init.sh
  # Commands the Reviewer must run before marking work done. Project-specific —
  # edit these per target repo.
  # No build/test/lint in the app sense — this is a distribution kit. The shipped
  # runtime artifacts are shell scripts, so "tests" = bash syntax check on them.
  test_command: "bash -n skills/start-feature/scripts/invoke-worker.sh skills/start-feature/scripts/install-agents.sh skills/start-feature/scripts/harness-delegate.sh"

  # shellcheck (0.11.0) lints the shipped runtime scripts at full default severity.
  lint_command: "shellcheck skills/start-feature/scripts/invoke-worker.sh skills/start-feature/scripts/install-agents.sh skills/start-feature/scripts/harness-delegate.sh"
  typecheck_command: ""   # not applicable — no typed source

umbrella:
  manifest: ""   # path to umbrella.manifest.yaml; presence = umbrella mode

# Telemetry (E05-F02): local-only sub-agent + human-gate timing. See docs/UMBRELLA.md
# is unrelated; see agents/orchestrator.md "## Telemetry". Absent block ⇒ enabled defaults.
telemetry:
  enabled: true            # false ⇒ Orchestrator skips telemetry capture entirely
  log: telemetry.jsonl     # resolved under HARNESS_DIR; gitignored/local-only

# Board mirror (optional, opt-in): one-way projection of tasks.json onto a project
# board. INERT by default (empty provider). MIRROR, not a backend. See store/board-mirror.md.
mirror:
  board:
    provider: ""          # ""|none disables; github-projects implemented; jira|azure-boards stubs
    owner: ""             # github-projects: org/user login
    project_number: 0     # github-projects: Project number
    repo: ""              # github-projects: owner/repo holding the issues
    # status_map:         # optional: harness status -> board column name (omit ⇒ identity)
    #   pending: "Todo"
    #   done: "Done"
